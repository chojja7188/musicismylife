<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숏폼 메이커</title>
<style>
  body { margin: 0; height: 100vh; box-sizing: border-box; padding: 20px; display: flex; gap: 24px;
         background: #0e0e0e; color: #eee; font: 14px -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif; }
  #panel { flex: 1; max-width: 560px; overflow: auto; }
  #stage { height: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; color: #999; font-size: 12px; margin-top: 8px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid #333; background: #191919; color: #eee; font: inherit; }
  input[type=file] { font-size: 12px; color: #999; max-width: 100%; }
  button { padding: 8px 14px; border-radius: 8px; border: 0; background: #2a2a2a; color: #eee; font: 600 13px inherit; cursor: pointer; }
  button:hover { background: #383838; }
  button.main { background: #e8e8e8; color: #000; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 0; }
  .track { background: #181818; border-radius: 10px; padding: 12px; margin: 10px 0; display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
  .track.picked { outline: 1px solid #555; }
  .track canvas { width: 76px; height: 76px; border-radius: 6px; background: #2a2a2a; }
  .track .tools { display: flex; gap: 6px; margin-top: 8px; }
  .track .tools button { padding: 5px 10px; font-size: 12px; }
  #status { margin: 12px 0; color: #aaa; min-height: 1.4em; }
  #status.warn { color: #ff8a65; }
  .hint { color: #777; font-size: 12px; line-height: 1.6; }
  @media (max-width: 800px) { /* 핸드폰: 미리보기 위, 입력 아래 */
    body { flex-direction: column; height: auto; padding: 12px; gap: 12px; }
    #stage { order: -1; height: auto; width: min(100%, 38vh); align-self: center; }
    #panel { max-width: none; overflow: visible; }
    input[type=text] { font-size: 16px; } /* 아이폰 확대 방지 */
    .track { grid-template-columns: 56px 1fr; }
    .track canvas { width: 56px; height: 56px; }
    button { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div id="panel">
  <h1>숏폼 메이커 <span class="hint">9:16 · 1080×1920</span></h1>
  <div class="row">
    <div><label>시리즈 제목 (비우면 안 나옴)</label><input type="text" id="series" placeholder="길 걸을 때 자신감 뿜뿜하는 노래"></div>
    <div style="flex:.6"><label>계정 이름</label><input type="text" id="brand" value="@musicismylife.mp3" placeholder="@mymusic"></div>
    <div style="flex:.35"><label>크로스페이드(초)</label><input type="text" id="fade" value="1.5"></div>
  </div>
  <div id="tracks"></div>
  <button id="add">+ 곡 추가</button>
  <div id="status"></div>
  <div class="row">
    <button id="play">▶ 미리보기</button>
    <button id="stop">■ 정지</button>
    <button id="rec" class="main">● 영상 만들기</button>
  </div>
  <p class="hint">
    · 구간은 <b>1:12</b>나 <b>72</b>처럼 적어요. 끝을 비우면 곡 끝까지 써요.<br>
    · mp3 파일 이름이 "가수 - 제목.mp3" 형식이면 제목과 가수가 자동으로 채워져요.<br>
    · 앨범 커버는 이미지를 복사한 뒤 곡 카드를 클릭하고 <b>⌘V</b>로 붙여넣어도 돼요.<br>
    · 영상은 실제 길이만큼 재생하면서 녹화돼요. <b>녹화가 끝날 때까지 이 탭을 화면에 띄워 두세요</b>. 다른 탭으로 가면 화면이 멈춰요. 핸드폰은 화면이 꺼지거나 다른 앱으로 가도 멈춰요.
  </p>
</div>
<canvas id="stage"></canvas>

<template id="tpl">
  <div class="track">
    <canvas width="152" height="152"></canvas>
    <div>
      <div class="row">
        <div><label>mp3</label><input type="file" accept="audio/*" class="audio"></div>
        <div><label>앨범 커버</label><input type="file" accept="image/*" class="cover"></div>
      </div>
      <div class="row">
        <div><label>제목</label><input type="text" class="title"></div>
        <div><label>가수</label><input type="text" class="artist"></div>
      </div>
      <div class="row">
        <div><label>시작</label><input type="text" class="start" value="0:00"></div>
        <div><label>끝</label><input type="text" class="end" placeholder="곡 끝까지"></div>
      </div>
      <div class="tools">
        <button class="solo">▶ 이 구간만</button>
        <button class="up">↑ 위로</button>
        <button class="del">✕ 삭제</button>
      </div>
    </div>
  </div>
</template>

<script>
const W = 1080, H = 1920, $ = s => document.querySelector(s);
const cv = $('#stage'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const FONT = '-apple-system, "Apple SD Gothic Neo", system-ui, sans-serif';

// ── 오디오: 모든 곡 → master → (스피커, 분석기, 녹화) ──
const ac = new AudioContext();
if (navigator.audioSession) navigator.audioSession.type = 'playback'; // 아이폰 무음 스위치가 켜져 있어도 소리 나게
const master = ac.createGain();
const analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.5;
const recDest = ac.createMediaStreamDestination();
master.connect(analyser); master.connect(ac.destination); master.connect(recDest);
const freq = new Uint8Array(analyser.frequencyBinCount);

// ── 앨범 커버 → 대표색 2개 (dj/overlay.html과 같은 방식) ──
function palette(img) {
  const c = document.createElement('canvas'); c.width = c.height = 48;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 48, 48);
  const d = x.getImageData(0, 0, 48, 48).data, bins = Array.from({ length: 12 }, () => ({ w: 0, s: 0 }));
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, ch = mx - mn;
    if (ch < 0.08 || l < 0.1 || l > 0.95) continue;
    const s = ch / (1 - Math.abs(2 * l - 1));
    let h = mx === r ? ((g - b) / ch) % 6 : mx === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
    h = (h * 60 + 360) % 360;
    const bin = bins[Math.floor(h / 30)], w = s * s;
    bin.w += w; bin.s += s * w;
  }
  const ranked = bins.map((b, k) => ({ h: k * 30 + 15, w: b.w, s: b.w ? b.s / b.w : 0 })).sort((a, b) => b.w - a.w);
  if (ranked[0].w < 2) return [[0, 0, 88], [0, 0, 62]];
  const top = ranked[0], second = ranked.find(b => b.w > top.w * 0.15 && Math.abs(((b.h - top.h + 540) % 360) - 180) > 40);
  const vivid = b => [b.h, Math.max(60, b.s * 100), 62];
  return [vivid(top), second ? vivid(second) : [(top.h + 40) % 360, Math.max(60, top.s * 100), 55]];
}
const hsl = ([h, s, l], a = 1) => `hsla(${h} ${s}% ${l}% / ${a})`;

// ── 커버 하나로 미리 그려두는 것들: 블러 배경, 둥근 커버, LP ──
const C = 600;                          // 커버 한 변
const CX = 150, CY = 400;               // 커버 왼쪽 위
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function drawCoverFit(x, img, dx, dy, dw, dh) {
  const s = Math.min(img.width, img.height);
  x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, dx, dy, dw, dh);
}
function prep(img) {
  const v = { img };
  [v.c1, v.c2] = img ? palette(img) : [[0, 0, 88], [0, 0, 62]];

  let x; [v.bg, x] = canvas(W, H);
  if (img) {
    const S = H * 1.2;
    if ('filter' in x) { x.filter = 'blur(60px) brightness(.3) saturate(1.4)'; drawCoverFit(x, img, (W - S) / 2, (H - S) / 2, S, S); }
    else { // 아이폰 iOS 17 이하는 ctx.filter가 없음 → 작게 그렸다 키워서 흐리게 + 어둡게
      const [t, tx] = canvas(16, 16); drawCoverFit(tx, img, 0, 0, 16, 16);
      x.imageSmoothingQuality = 'high'; x.drawImage(t, (W - S) / 2, (H - S) / 2, S, S);
      x.fillStyle = 'rgba(0,0,0,.68)'; x.fillRect(0, 0, W, H);
    }
  }
  else { x.fillStyle = '#0b0b0b'; x.fillRect(0, 0, W, H); }

  [v.cover, x] = canvas(C, C);
  x.beginPath(); x.roundRect(0, 0, C, C, 18); x.clip();
  if (img) drawCoverFit(x, img, 0, 0, C, C);
  else { const g = x.createLinearGradient(0, 0, C, C); g.addColorStop(0, '#333'); g.addColorStop(1, '#111'); x.fillStyle = g; x.fillRect(0, 0, C, C); }

  [v.vinyl, x] = canvas(C, C);
  const r = C / 2;
  x.fillStyle = '#111'; x.beginPath(); x.arc(r, r, r, 0, 7); x.fill();
  x.strokeStyle = '#1c1c1c'; x.lineWidth = 2;
  for (let k = r * 0.36; k < r - 4; k += 5) { x.beginPath(); x.arc(r, r, k, 0, 7); x.stroke(); }
  const shine = x.createConicGradient(0.5, r, r);
  [[0, 0], [.1, 0], [.14, .09], [.18, 0], [.6, 0], [.64, .09], [.68, 0], [1, 0]].forEach(([p, a]) => shine.addColorStop(p, `rgba(255,255,255,${a})`));
  x.fillStyle = shine; x.beginPath(); x.arc(r, r, r, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(r, r, r * 0.34, 0, 7); x.clip();
  if (img) drawCoverFit(x, img, r * 0.66, r * 0.66, r * 0.68, r * 0.68); else { x.fillStyle = '#444'; x.fill(); }
  x.restore();
  x.fillStyle = '#000'; x.beginPath(); x.arc(r, r, r * 0.03, 0, 7); x.fill();
  return v;
}
const EMPTY = prep(null);

// ── 곡 카드 ──
const parseT = s => { s = String(s).trim(); if (!s) return NaN; const p = s.split(':').map(Number); return p.length > 1 ? p[0] * 60 + p[1] : p[0]; };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

async function setCover(el, f) {
  try {
    const img = await createImageBitmap(f); // ImageBitmap은 캔버스를 오염시키지 않음 → 녹화 가능
    el.data.vis = prep(img); el.data.cover = f;
    const thumb = el.querySelector('canvas').getContext('2d');
    thumb.clearRect(0, 0, 152, 152); drawCoverFit(thumb, img, 0, 0, 152, 152);
  } catch { status(`${f.name}: 이미지를 읽을 수 없어요`, true); }
  refresh();
}

// 이미지 붙여넣기(⌘V) → 마지막으로 클릭한 카드, 없으면 커버 없는 첫 카드
let picked = null;
const pick = e => { const t = e.target.closest('.track'); if (!t) return; picked?.classList.remove('picked'); (picked = t).classList.add('picked'); };
$('#tracks').addEventListener('pointerdown', pick);
$('#tracks').addEventListener('focusin', pick);
document.addEventListener('paste', e => {
  const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/')); if (!f) return;
  e.preventDefault();
  const cards = [...$('#tracks').children];
  const el = picked?.isConnected ? picked : cards.find(c => c.data.vis === EMPTY);
  el ? setCover(el, f) : status('커버를 넣을 곡 카드를 먼저 클릭하고 붙여넣어 주세요', true);
});

async function loadAudio(el, f) {
  status(`${f.name} 읽는 중…`);
  try { el.data.buf = await ac.decodeAudioData(await f.arrayBuffer()); el.data.audio = f; }
  catch { el.data.buf = null; return status(`${f.name}: 오디오를 읽을 수 없어요`, true); }
  const name = f.name.replace(/\.[^.]+$/, ''), [a, t] = name.includes(' - ') ? name.split(' - ', 2) : ['', name];
  if (!el.querySelector('.title').value) el.querySelector('.title').value = t.trim();
  if (!el.querySelector('.artist').value) el.querySelector('.artist').value = a.trim();
  refresh();
}

function addTrack() {
  const el = $('#tpl').content.firstElementChild.cloneNode(true);
  el.data = { buf: null, vis: EMPTY };
  el.querySelector('.audio').onchange = e => e.target.files[0] && loadAudio(el, e.target.files[0]);
  el.querySelector('.cover').onchange = e => e.target.files[0] && setCover(el, e.target.files[0]);
  el.querySelector('.solo').onclick = e => { // 재생 중이면 정지 버튼으로 동작
    if (live?.solo === el) return stop();
    const p = plan([el]); if (!p.tracks.length) return status(p.err, true);
    play(p); live.solo = el; e.target.textContent = '■ 정지';
  };
  el.querySelector('.up').onclick = () => { el.previousElementSibling && el.parentNode.insertBefore(el, el.previousElementSibling); refresh(); };
  el.querySelector('.del').onclick = () => { el.remove(); refresh(); };
  $('#tracks').append(el);
  refresh();
  return el;
}

// 카드들 → 타임라인. 곡 i는 S초에 시작해서 d초 동안 재생, 다음 곡과 F초 겹침
function plan(cards = [...$('#tracks').children]) {
  const F = Math.max(0.2, +$('#fade').value || 1.5);
  const tracks = []; let S = 0, err = '';
  cards.forEach((el, n) => {
    const { buf, vis } = el.data, q = c => el.querySelector(c).value;
    if (!buf) { err ||= `${n + 1}번 곡: mp3를 넣어 주세요`; return; }
    const start = parseT(q('.start')) || 0;
    const end = Math.min(buf.duration, parseT(q('.end')) || Infinity);
    const d = end - start;
    if (!(d > F * 2)) { err ||= `${n + 1}번 곡: 구간이 너무 짧아요 (크로스페이드의 2배 이상)`; return; }
    tracks.push({ buf, vis, title: q('.title'), artist: q('.artist'), start, d, S });
    S += d - F;
  });
  const last = tracks.at(-1), O = tracks.length > 1 ? 5 : 0; // 끝에 O초 동안 곡 목록 (곡 2개 이상일 때)
  return { tracks, F, O, total: last ? last.S + last.d + O : 0, err };
}

let idle = plan();
function status(msg, warn) { $('#status').textContent = msg; $('#status').className = warn ? 'warn' : ''; }
function refresh() {
  save();
  idle = plan();
  if (idle.err) return status(idle.err, true);
  if (!idle.tracks.length) return status('곡을 추가해 주세요');
  status(`총 ${idle.total.toFixed(1)}초 · ${idle.tracks.length}곡`);
}
$('#panel').addEventListener('input', e => { if (e.target.type === 'text') refresh(); });

// ── 재생 ──
let live = null, sources = [];
function play(p) {
  stop(); ac.resume();
  const t0 = ac.currentTime + 0.2;
  p.tracks.forEach((tr, i) => {
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = tr.buf; s.connect(g).connect(master);
    const len = Math.min(tr.buf.duration - tr.start, tr.d + (i === p.tracks.length - 1 ? p.O : 0)); // 마지막 곡은 목록 화면까지 이어서
    const a = t0 + tr.S, b = a + len, fin = i ? p.F : 0.3; // 첫 곡은 바로 들리게
    g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(1, a + fin);
    g.gain.setValueAtTime(1, b - p.F); g.gain.linearRampToValueAtTime(0, b);
    s.start(a, tr.start, len);
    sources.push(s);
  });
  live = { ...p, t0 };
}
function stop() { sources.forEach(s => { try { s.stop(); } catch {} }); sources = []; live = null; document.querySelectorAll('.solo').forEach(b => b.textContent = '▶ 이 구간만'); }
$('#add').onclick = addTrack;
$('#play').onclick = () => { const p = plan(); p.err || !p.tracks.length ? status(p.err || '곡을 추가해 주세요', true) : play(p); };
$('#stop').onclick = () => { if (recorder) { recorder.cancelled = true; recorder.stop(); } stop(); };

// ── 녹화: 캔버스 화면 + master 소리 → mp4 (안 되면 webm) ──
let recorder = null;
$('#rec').onclick = async () => {
  const p = plan();
  if (p.err || !p.tracks.length) return status(p.err || '곡을 추가해 주세요', true);
  if (recorder) return;
  if (p.total > 60 && !confirm(`총 ${fmt(p.total)}로 1분이 넘어요. 그래도 만들까요?`)) return status(`총 ${p.total.toFixed(1)}초 · 1분이 넘어요. 구간을 줄여 주세요`, true);
  const mime = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6, audioBitsPerSecond: 256e3 });
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    clearTimeout(timer); stop(); const cancelled = recorder.cancelled; recorder = null; $('#rec').textContent = '● 영상 만들기';
    if (cancelled) return status('녹화를 취소했어요');
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime.split(';')[0] || 'video/webm' }));
    a.download = `${($('#series').value || p.tracks[0].title || 'shortform').replace(/[\\/:*?"<>|]/g, '')}_${new Date().toLocaleDateString('sv')}.${ext}`;
    a.click();
    status(`저장했어요: ${a.download}`);
  };
  await ac.resume();
  play(p); recorder.start(1000);
  $('#rec').textContent = '● 녹화 중…';
  status(`녹화 중… ${p.total.toFixed(1)}초 동안 이 탭을 띄워 두세요`);
  const timer = setTimeout(() => recorder && recorder.stop(), (p.total + 0.6) * 1000);
};

// ── 화면 ──
const N = 48, lvl = new Float32Array(N);
function bands(v) { // dj/overlay.html과 같은 대역 나누기: 빠른 상승 / 느린 하강
  for (let j = 0; j < N; j++) {
    const lo = Math.floor(2 + Math.pow(j / N, 1.7) * 220), hi = Math.floor(2 + Math.pow((j + 1) / N, 1.7) * 220) + 1;
    let m = 0; for (let k = lo; k < hi; k++) m = Math.max(m, v(k));
    lvl[j] = Math.max(Math.pow(m, 1.6) * (1 + j / N * 0.8), lvl[j] * 0.86);
  }
}
function wrap(text, maxW, maxLines) { // 띄어쓰기 기준 줄바꿈, 넘치면 …
  const out = []; let cur = '';
  for (const w of text.split(/\s+/).filter(Boolean)) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (out.length > maxLines) { out.length = maxLines; out[maxLines - 1] += '…'; }
  return out.map(l => { while (ctx.measureText(l).width > maxW && l.length > 1) l = l.slice(0, -2) + '…'; return l; });
}

let rot = 0, spin = 0, out = 0, bassS = 0, bassAvg = 0, kick = 0, lastBeat = 0, rings = [];

function fg(tr, idx, count, t, a, slide) {
  if (a <= 0) return;
  const v = tr.vis;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(slide * W * 0.3, 0);
  // LP (커버 오른쪽으로 빠져나와 회전) + 커버
  ctx.save();
  ctx.translate(CX + C / 2 + out * 180, CY + C / 2); ctx.rotate(rot * Math.PI / 180);
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  ctx.drawImage(v.vinyl, -C / 2, -C / 2);
  ctx.restore();
  ctx.save();
  const s = 1 + bassS * 0.04 + kick * 0.04;
  ctx.translate(CX + C / 2, CY + C / 2); ctx.scale(s, s);
  ctx.shadowColor = hsl(v.c1, 0.25 + bassS * 0.5); ctx.shadowBlur = 20 + bassS * 90 + kick * 60;
  ctx.drawImage(v.cover, -C / 2, -C / 2);
  ctx.restore();

  // 제목 · 가수
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `800 76px ${FONT}`; ctx.fillStyle = '#fff';
  let y = 1170;
  for (const l of wrap(tr.title || '제목', 840, 2)) { ctx.fillText(l, 120, y); y += 90; }
  ctx.font = `500 46px ${FONT}`; ctx.fillStyle = hsl(v.c1, 0.9);
  ctx.fillText(wrap(tr.artist || '', 840, 1)[0] || '', 120, y + 4);

  // 진행바: 원곡 기준 위치
  const cur = tr.start + Math.max(0, Math.min(tr.d, t - tr.S)), dur = tr.buf.duration;
  const by = 1400;
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.beginPath(); ctx.roundRect(120, by, 840, 8, 4); ctx.fill();
  const g = ctx.createLinearGradient(120, 0, 960, 0); g.addColorStop(0, hsl(v.c2)); g.addColorStop(1, hsl(v.c1));
  ctx.fillStyle = g; ctx.shadowColor = hsl(v.c1); ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.roundRect(120, by, Math.max(8, 840 * cur / dur), 8, 4); ctx.fill(); ctx.shadowBlur = 0;
  ctx.font = `500 30px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText(fmt(cur), 120, by + 50); ctx.textAlign = 'right'; ctx.fillText(fmt(dur), 960, by + 50);

  ctx.restore();
}

function fx(tr, a) { // 커버 뒤 글로우 + 스펙트럼 (곡 색깔로)
  if (a <= 0) return;
  const v = tr.vis, cx = CX + C / 2, cy = CY + C / 2;
  ctx.save(); ctx.globalAlpha = a;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, C * (1.1 + bassS * 0.6));
  glow.addColorStop(0, hsl(v.c1, 0.18 + bassS * 0.35 + kick * 0.2)); glow.addColorStop(1, hsl(v.c1, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const top = 1500, h = 280, mid = top + h / 2, bw = 840 / (N * 2);
  const grad = ctx.createLinearGradient(0, top, 0, top + h);
  grad.addColorStop(0, hsl(v.c2)); grad.addColorStop(0.5, hsl(v.c1)); grad.addColorStop(1, hsl(v.c2));
  ctx.fillStyle = grad; ctx.shadowColor = hsl(v.c1, 0.8); ctx.shadowBlur = 8 + bassS * 20;
  for (let j = 0; j < N; j++) {
    const bh = Math.max(h * 0.03, Math.min(1, lvl[j]) * h / 2 * 0.92);
    for (const x of [W / 2 + j * bw, W / 2 - (j + 1) * bw]) ctx.fillRect(x + bw * 0.18, mid - bh, bw * 0.64, bh * 2);
  }
  ctx.restore();
}

function outro(p, u) { // 마지막 곡 위로 어두운 막 + 곡 목록이 위에서부터 하나씩
  const n = p.tracks.length, h = Math.min(200, 1300 / n), th = h * 0.78, y0 = 440 + (1300 - n * h) / 2;
  ctx.fillStyle = `rgba(0,0,0,${0.5 * Math.min(1, u / 0.6)})`; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  p.tracks.forEach((tr, j) => {
    const a = Math.max(0, Math.min(1, (u - 0.4 - j * 0.18) / 0.4)); if (!a) return;
    const y = y0 + j * h + (1 - a) * (1 - a) * -40, cy = y + h / 2;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `700 ${Math.round(th * 0.32)}px ${FONT}`; ctx.fillStyle = hsl(tr.vis.c1, 0.9);
    ctx.fillText(String(j + 1).padStart(2, '0'), 100, cy);
    ctx.drawImage(tr.vis.cover, 190, cy - th / 2, th, th);
    const x = 190 + th + 36, mw = 960 - x;
    ctx.font = `800 ${Math.round(th * 0.3)}px ${FONT}`; ctx.fillStyle = '#fff';
    ctx.fillText(wrap(tr.title || '제목', mw, 1)[0], x, cy - th * 0.18);
    ctx.font = `500 ${Math.round(th * 0.22)}px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText(wrap(tr.artist || '', mw, 1)[0] || '', x, cy + th * 0.2);
    ctx.restore();
  });
  ctx.textBaseline = 'alphabetic';
}

function frame(now) {
  requestAnimationFrame(frame);
  const p = live || idle, playing = !!live;
  const t = playing ? ac.currentTime - live.t0 : 0;
  if (playing && t > live.total + 0.3 && !recorder) stop();

  analyser.getByteFrequencyData(freq);
  const v = i => Math.min(1, freq[i] / 255 * 1.3);
  const bass = (v(1) + v(2) + v(3) + v(4)) / 4;
  bassS += (bass - bassS) * 0.5; bassAvg += (bass - bassAvg) * 0.02;
  if (bass > bassAvg * 1.25 + 0.06 && bass > 0.3 && now - lastBeat > 200) { lastBeat = now; kick = 1; rings.push({ r: 0, a: 0.9, c: null }); }
  kick *= 0.88;
  bands(v);
  spin += ((playing ? 1 : 0) - spin) * 0.03; out += (1 - out) * 0.06; rot += spin * 200 / 60;

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!p.tracks.length) {
    ctx.fillStyle = '#555'; ctx.font = `600 48px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('곡을 추가해 주세요', W / 2, H / 2); return;
  }
  // 지금 곡 i, 앞 곡과 겹치는 중이면 k: 0→1
  let i = 0; while (i + 1 < p.tracks.length && p.tracks[i + 1].S <= t) i++;
  const cur = p.tracks[i], prev = p.tracks[i - 1];
  const k = prev ? Math.min(1, (t - cur.S) / p.F) : 1, ease = k * k * (3 - 2 * k);

  if (prev) ctx.drawImage(prev.vis.bg, 0, 0);
  ctx.globalAlpha = ease; ctx.drawImage(cur.vis.bg, 0, 0); ctx.globalAlpha = 1;
  if (prev) fx(prev, 1 - ease);
  fx(cur, ease);
  rings = rings.filter(g => g.a > 0.02);
  for (const g of rings) {
    g.c ||= cur.vis[rings.length % 2 ? 'c2' : 'c1'];
    g.r += C * 0.025; g.a *= 0.95;
    ctx.strokeStyle = hsl(g.c, g.a); ctx.lineWidth = C * 0.012;
    ctx.beginPath(); ctx.arc(CX + C / 2, CY + C / 2, C * 0.5 + g.r, 0, 7); ctx.stroke();
  }
  const uo = t - (p.total - p.O), ko = p.O ? Math.max(0, Math.min(1, uo / 0.6)) : 0; // 목록 화면 전환 0→1
  if (prev) fg(prev, i - 1, p.tracks.length, t, (1 - ease) * (1 - ko), -ease);
  fg(cur, i, p.tracks.length, t, ease * (1 - ko), 1 - ease);
  if (ko > 0) outro(p, uo);

  // 시리즈 제목은 고정, 번호만 바뀜
  const series = $('#series').value.trim();
  if (series) {
    ctx.textAlign = 'center';
    ctx.font = `800 54px ${FONT}`; ctx.fillStyle = '#fff';
    wrap(series, 900, 2).forEach((l, n) => ctx.fillText(l, W / 2, 275 + n * 66));
    ctx.font = `600 30px ${FONT}`;
    const num = n => `${String(n + 1).padStart(2, '0')} / ${String(p.tracks.length).padStart(2, '0')}`;
    if (p.tracks.length > 1) [[prev, i - 1, 1 - ease], [cur, i, ease]].forEach(([tr, n, a]) => {
      if (tr && a > 0) { ctx.fillStyle = hsl(tr.vis.c1, 0.9 * a * (1 - ko)); ctx.fillText(num(n), W / 2, 200); }
    });
  }
  const brand = $('#brand').value.trim();
  if (brand) { ctx.textAlign = 'center'; ctx.font = `600 32px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillText(brand, W / 2, 1855); }

  // 시작 0.4초 페이드 인, 마지막 크로스페이드 길이만큼 페이드 아웃
  if (playing) {
    const black = t < 0.4 ? 1 - Math.max(0, t) / 0.4 : t > p.total - p.F ? Math.min(1, (t - (p.total - p.F)) / p.F) : 0;
    if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
  }
}
// ── 일시저장: 바뀔 때마다 브라우저(IndexedDB)에 저장 → 새로고침해도 이어서. 이 기기·이 브라우저에만 남음 ──
const db = new Promise((ok, no) => { const r = indexedDB.open('shortform', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idb = (mode, f) => db.then(d => new Promise((ok, no) => { const r = f(d.transaction('s', mode).objectStore('s')); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }));
let restoring = true, saveT;
function save() {
  if (restoring) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const tracks = [...$('#tracks').children].map(el => {
      const q = c => el.querySelector(c).value;
      return { audio: el.data.audio, cover: el.data.cover, title: q('.title'), artist: q('.artist'), start: q('.start'), end: q('.end') };
    });
    idb('readwrite', s => s.put({ series: $('#series').value, brand: $('#brand').value, fade: $('#fade').value, tracks }, 'draft'))
      .catch(() => status('일시저장 실패 (저장 공간 부족?) · 새로고침하면 지워질 수 있어요', true));
  }, 400);
}
(async () => {
  const d = await idb('readonly', s => s.get('draft')).catch(() => null);
  if (d?.tracks?.length) {
    for (const k of ['series', 'brand', 'fade']) $('#' + k).value = d[k];
    await Promise.all(d.tracks.map(t => {
      const el = addTrack();
      for (const k of ['title', 'artist', 'start', 'end']) el.querySelector('.' + k).value = t[k];
      return Promise.all([t.audio && loadAudio(el, t.audio), t.cover && setCover(el, t.cover)]);
    }));
  } else addTrack();
  restoring = false; refresh();
})();
requestAnimationFrame(frame);
</script>
